spring.application.name=tm-service
spring.config.import=optional:file:src/.env[.properties],optional:file:.env[.properties]
server.port=${SERVER_PORT}

# TM database (read/write)
spring.datasource.tm.jdbc-url=${TM_DB_URL}
spring.datasource.tm.username=${TM_DB_USERNAME}
spring.datasource.tm.password=${TM_DB_PASSWORD}
spring.datasource.tm.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.tm.pool-name=tm-hikari-pool
spring.datasource.tm.maximum-pool-size=${TM_DB_MAX_POOL_SIZE:12}
spring.datasource.tm.minimum-idle=${TM_DB_MIN_IDLE:4}
spring.datasource.tm.connection-timeout=${TM_DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.tm.idle-timeout=${TM_DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.tm.max-lifetime=${TM_DB_MAX_LIFETIME_MS:1800000}
spring.datasource.tm.validation-timeout=${TM_DB_VALIDATION_TIMEOUT_MS:5000}

# EAM database (read-only)
spring.datasource.eam.jdbc-url=${EAM_DB_URL}
spring.datasource.eam.username=${EAM_DB_USERNAME}
spring.datasource.eam.password=${EAM_DB_PASSWORD}
spring.datasource.eam.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.eam.pool-name=eam-hikari-pool
spring.datasource.eam.maximum-pool-size=${EAM_DB_MAX_POOL_SIZE:20}
spring.datasource.eam.minimum-idle=${EAM_DB_MIN_IDLE:6}
spring.datasource.eam.connection-timeout=${EAM_DB_CONNECTION_TIMEOUT_MS:20000}
spring.datasource.eam.idle-timeout=${EAM_DB_IDLE_TIMEOUT_MS:300000}
spring.datasource.eam.max-lifetime=${EAM_DB_MAX_LIFETIME_MS:1800000}
spring.datasource.eam.validation-timeout=${EAM_DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.eam.read-only=true
spring.datasource.eam.auto-commit=false
spring.datasource.eam.transaction-isolation=TRANSACTION_READ_COMMITTED

# JPA (TM only)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=dbo


# Swagger/OpenAPI
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.url=/v3/api-docs
server.forward-headers-strategy=framework

logging.pattern.level=%5p [cid:%X{correlationId:-}]
logging.level.org.springframework.jdbc.core.JdbcTemplate=INFO
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=INFO

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.auth.login.max-failed-attempts=${APP_AUTH_LOGIN_MAX_FAILED_ATTEMPTS:5}
app.auth.login.block-seconds=${APP_AUTH_LOGIN_BLOCK_SECONDS:120}
app.mfa.encryption-key=${APP_MFA_ENCRYPTION_KEY:TM_Default_MFA_Encryption_Key_Change_Me}
app.mfa.token-expiration-ms=${APP_MFA_TOKEN_EXPIRATION_MS:300000}
app.mfa.app-name=${APP_MFA_APP_NAME:TM}
app.mfa.qr-size=${APP_MFA_QR_SIZE:240}
app.mfa.email-otp-expiry-minutes=${APP_MFA_EMAIL_OTP_EXPIRY_MINUTES:5}
app.mfa.rate-limit.max-attempts=${APP_MFA_RATE_LIMIT_MAX_ATTEMPTS:5}
app.mfa.rate-limit.window-seconds=${APP_MFA_RATE_LIMIT_WINDOW_SECONDS:300}
timesheet.pay-period-grace-days=${TIMESHEET_PAY_PERIOD_GRACE_DAYS:3}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8082,http://127.0.0.1:4200,http://3.82.49.182:4500}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://*.ngrok-free.app,http://*.ngrok-free.app}

# Actuator (optional)
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health}
management.endpoint.health.show-details=never

# ---------- Mail Configuration ----------
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enforce-credentials=${APP_MAIL_ENFORCE_CREDENTIALS:true}
